<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | The Philippine Artisan</title>
  <link rel="stylesheet" href="styles/admin.css" />
  <link rel="icon" href="../assets/artisan-logo.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">
      <img src="../assets/artisan-logo.jpg" class="admin-logo" alt="Artisan Logo">
      <h1>Admin Dashboard</h1>
    </div>
    <nav class="admin-nav">
      <a href="../index.html" class="link">Home</a>
      <button id="logoutBtn" class="btn danger">Logout</button>
    </nav>
  </header>

  <main class="admin-container">
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-top">
          <h3>Total Users</h3>
        </div>
        <p id="statTotal" class="stat-value">0</p>
      </div>
      <div class="stat-card">
        <div class="stat-top">
          <h3>Admin Count</h3>
        </div>
        <p id="statAdmins" class="stat-value">0</p>
      </div>
      <div class="stat-card span-2">
        <div class="stat-top">
          <h3>Recent Signups</h3>
        </div>
        <ul id="recentUsers" class="recent-list"></ul>
      </div>
    </section>

    <section class="users-section">
      <div class="section-header">
        <h2>Manage Users</h2>
        <div class="actions">
          <input id="searchInput" class="input" placeholder="Search by name or email" />
        </div>
      </div>
      <div class="table-wrapper">
        <table class="users-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <!-- Create/Update Modal -->
    <div id="userModal" class="modal hidden" aria-hidden="true" role="dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Create User</h3>
          <button id="closeModal" class="icon-btn" aria-label="Close">✕</button>
        </div>
        <form id="userForm" class="form-grid">
          <input type="hidden" id="userId" />
          <label>
            <span>Name</span>
            <input type="text" id="name" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" id="email" required />
          </label>
          <label>
            <span>Role</span>
            <select id="role">
              <option>User</option>
              <option>Admin</option>
            </select>
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="password" placeholder="(leave empty to keep)" />
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn primary" id="saveBtn">Save</button>
            <button type="button" class="btn" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="scripts/dynamic-nav.js"></script>
  <script src="scripts/admin-dashboard.js"></script>
</body>
</html>
